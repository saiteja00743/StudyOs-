    <path d="M18 8C14.5 8 11 10.5 11 14.5C11 16 11.5 17.3 12.4 18.3C11.5 19 11 20.2 11 21.5C11 23.5 12.3 25.2 14.1 25.8C14 26.2 14 26.6 14 27C14 29.2 15.8 31 18 31L18 8Z" opacity="0.95"/>

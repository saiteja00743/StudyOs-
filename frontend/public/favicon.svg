    <path d="M14.5 20 Q12.5 22 14.5 24" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Brain folds - right -->
    <path d="M29.5 16 Q31.5 18 29.5 20" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M29.5 20 Q31.5 22 29.5 24" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
